services:
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: reconstruction-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:-}
    command: sh -c "npx prisma migrate deploy && npx prisma db push --skip-generate && npm run prisma:seed"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: reconstruction-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      NODE_ENV: production
      PORT: 4000
      DOMAIN: ${DOMAIN:-http://localhost:5001}
      LDAP_ENCRYPTION_KEY: ${LDAP_ENCRYPTION_KEY:-}
      UKM_SQL_SERVER: ${UKM_SQL_SERVER:-}
      UKM_SQL_PORT: ${UKM_SQL_PORT:-1433}
      UKM_SQL_DATABASE: ${UKM_SQL_DATABASE:-Ukm_Data}
      UKM_SQL_USER: ${UKM_SQL_USER:-}
      UKM_SQL_PASSWORD: ${UKM_SQL_PASSWORD:-}
      UKM_SQL_VIEW: ${UKM_SQL_VIEW:-[Ukm_Data].[dbo].[v_1C_Shops_Info]}
      PYTHON_EXECUTABLE: python3
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reconstruction-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5001:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
