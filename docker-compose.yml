services:
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: reconstruction-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        npx prisma migrate deploy &&
        NEEDS_BOOTSTRAP=$(node -e '
        const { PrismaClient } = require("@prisma/client");
        (async () => {
          const prisma = new PrismaClient();
          try {
            const expected = ["users", "roles", "tus", "shop_directory", "scheduler_tasks", "store_projects", "comments", "audit_logs", "ldap_settings"];
            const rows = await prisma.$queryRawUnsafe("SELECT table_name FROM information_schema.tables WHERE table_schema = '\''public'\''");
            const found = new Set(rows.map(row => row.table_name));
            const missing = expected.filter(name => !found.has(name));
            const roleCount = found.has("roles") ? await prisma.role.count() : 0;
            const userCount = found.has("users") ? await prisma.user.count() : 0;
            console.log(missing.length > 0 || roleCount === 0 || userCount === 0 ? "yes" : "no");
          } catch (error) {
            console.error(error);
            process.exitCode = 2;
          } finally {
            await prisma.$disconnect();
          }
        })();
        ') &&
        if [ "$NEEDS_BOOTSTRAP" = "yes" ]; then
          echo "Database bootstrap required: tables or initial records are missing."
          printf '%s\n' 'ALTER TABLE public.users DROP COLUMN IF EXISTS "userName";' |
            npx prisma db execute --stdin --schema prisma/schema.prisma &&
          npx prisma db execute --stdin --schema prisma/schema.prisma <<'SQL' &&
        CREATE TABLE IF NOT EXISTS public.shop_directory (
          "id" TEXT NOT NULL PRIMARY KEY,
          "shopNumber" TEXT NOT NULL,
          "city" TEXT NOT NULL DEFAULT '',
          "address" TEXT NOT NULL,
          "workHours" TEXT NOT NULL DEFAULT '',
          "areaManager" TEXT NOT NULL DEFAULT '',
          "areaManagerPhone" TEXT NOT NULL DEFAULT '',
          "tu" TEXT NOT NULL DEFAULT '',
          "directorate" TEXT NOT NULL DEFAULT '',
          "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
          "updatedAt" TIMESTAMP(3) NOT NULL
        );
        CREATE UNIQUE INDEX IF NOT EXISTS "shop_directory_shopNumber_key" ON public.shop_directory ("shopNumber");
        CREATE INDEX IF NOT EXISTS "shop_directory_city_idx" ON public.shop_directory ("city");
        ALTER TABLE public.store_projects ADD COLUMN IF NOT EXISTS "city" TEXT;
        ALTER TABLE public.store_projects ADD COLUMN IF NOT EXISTS "address" TEXT;
        INSERT INTO public.shop_directory ("id", "shopNumber", "city", "address", "workHours", "areaManager", "areaManagerPhone", "tu", "directorate", "createdAt", "updatedAt")
        SELECT gen_random_uuid()::text, lpad(p."storeNumber", 3, '0'), COALESCE(MAX(p."city"), ''), COALESCE(MAX(p."address"), 'Адрес не указан'), '', '', '', '', '', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
        FROM public.store_projects AS p
        WHERE NOT EXISTS (SELECT 1 FROM public.shop_directory AS s WHERE s."shopNumber" = p."storeNumber" OR s."shopNumber" = lpad(p."storeNumber", 3, '0') OR s."id" = p."storeNumber")
        GROUP BY p."storeNumber"
        ON CONFLICT ("shopNumber") DO NOTHING;
        UPDATE public.store_projects AS p SET "storeNumber" = s."id" FROM public.shop_directory AS s WHERE p."storeNumber" = s."shopNumber" OR lpad(p."storeNumber", 3, '0') = s."shopNumber";
        ALTER TABLE public.store_projects DROP COLUMN IF EXISTS "address";
        ALTER TABLE public.store_projects DROP COLUMN IF EXISTS "city";
        SQL
          npx prisma db push --skip-generate &&
          npm run prisma:seed
        else
          echo "Database schema and initial records are present; skipping bootstrap and seed."
        fi
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: reconstruction-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      NODE_ENV: production
      PORT: 4000
      DOMAIN: ${DOMAIN:-http://localhost:5001}
      LDAP_ENCRYPTION_KEY: ${LDAP_ENCRYPTION_KEY:-}
      UKM_SQL_SERVER: ${UKM_SQL_SERVER:-}
      UKM_SQL_PORT: ${UKM_SQL_PORT:-1433}
      UKM_SQL_DATABASE: ${UKM_SQL_DATABASE:-Ukm_Data}
      UKM_SQL_USER: ${UKM_SQL_USER:-}
      UKM_SQL_PASSWORD: ${UKM_SQL_PASSWORD:-}
      UKM_SQL_VIEW: ${UKM_SQL_VIEW:-[Ukm_Data].[dbo].[v_1C_Shops_Info]}
      PYTHON_EXECUTABLE: python3
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reconstruction-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5001:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
